<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>材料涨价雷达</title>
  <style>{{STYLES}}</style>
</head>
<body>
  <main class="page-shell">
    <header class="hero" aria-labelledby="report-title">
      <h1 id="report-title"></h1>
      <div class="hero-meta" id="hero-meta"></div>
      <p class="hero-note">扫描监控窗口内已经发生的价格变化、价格前动作与供需拐点，按消息密度、来源质量、价格验证、供给约束和 A 股异动评分。</p>
    </header>

    <section class="overview" aria-labelledby="overview-title">
      <h2 id="overview-title"><span class="section-index">0</span> 涨价与供需雷达总览（按评分排序）</h2>
      <div class="table-card">
        <table>
          <thead>
            <tr>
              <th>材料链</th>
              <th>分类</th>
              <th>总分</th>
              <th>状态</th>
              <th>确认路径</th>
              <th>价格阶段</th>
              <th>核心催化</th>
            </tr>
          </thead>
          <tbody id="radar-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="appendix" aria-labelledby="appendix-title">
      <h2 id="appendix-title"><span class="section-index">1</span> 证据附录</h2>
      <div id="detail-list"></div>
    </section>

    <section class="excluded" id="excluded-section" aria-labelledby="excluded-title" hidden>
      <h2 id="excluded-title"><span class="section-index">2</span> 已排除候选</h2>
      <div class="detail-card"><ul id="excluded-list"></ul></div>
    </section>
  </main>

  <script type="application/json" id="radar-data">{{DATA_JSON}}</script>
  <script>
    (() => {
      const data = JSON.parse(document.getElementById('radar-data').textContent);
      const title = data.title || '材料涨价雷达';
      document.title = title;
      document.getElementById('report-title').textContent = title;

      const meta = document.getElementById('hero-meta');
      [data.as_of, `Schema ${data.schema_version || '—'}`, `方法 ${data.method_version || '—'}`, `监控窗口：近${data.window_days}天`, `覆盖 ${data.candidate_count} 条材料链`]
        .forEach(value => {
          const pill = document.createElement('span');
          pill.className = 'meta-pill';
          pill.textContent = value;
          meta.appendChild(pill);
        });

      const safeUrl = value => {
        try {
          const url = new URL(value);
          return ['http:', 'https:'].includes(url.protocol) ? url.href : '';
        } catch (_) {
          return '';
        }
      };
      const valueOrDash = value => value === undefined || value === null || value === '' ? '—' : String(value);
      const statusClass = status => ({
        '高确定性': 'status-high',
        '发酵中': 'status-fermenting',
        '观察': 'status-watch',
        '证据不足': 'status-low'
      }[status] || 'status-low');

      const rows = document.getElementById('radar-rows');
      data.candidates.forEach(item => {
        const row = document.createElement('tr');
        const cells = [
          ['材料链', item.material_chain, 'material'],
          ['分类', item.category, 'category'],
          ['总分', null, 'score'],
          ['状态', null, 'status'],
          ['确认路径', item.gate_path, 'path'],
          ['价格阶段', item.score_details && item.score_details.price_validation && item.score_details.price_validation.evidence_type, 'stage'],
          ['核心催化', item.core_catalyst, 'catalyst']
        ];
        cells.forEach(([label, value, col]) => {
          const cell = document.createElement('td');
          cell.dataset.label = label;
          cell.dataset.col = col;
          if (col === 'score') {
            const wrap = document.createElement('div');
            wrap.className = 'score-wrap';
            const track = document.createElement('span');
            track.className = 'score-track';
            const fill = document.createElement('span');
            fill.className = 'score-fill';
            fill.style.width = `${Math.max(0, Math.min(100, Number(item.total_score) || 0))}%`;
            track.appendChild(fill);
            const number = document.createElement('strong');
            number.textContent = valueOrDash(item.total_score);
            wrap.append(track, number);
            cell.appendChild(wrap);
          } else if (col === 'status') {
            const badge = document.createElement('span');
            badge.className = `status-badge ${statusClass(item.status)}`;
            badge.textContent = valueOrDash(item.status);
            cell.appendChild(badge);
          } else {
            cell.textContent = valueOrDash(value);
          }
          row.appendChild(cell);
        });
        rows.appendChild(row);
      });

      const scoreNames = {
        message_density: '消息密度',
        source_quality: '来源质量',
        price_validation: '价格验证',
        supply_constraint: '供给约束',
        a_share_movement: 'A股异动'
      };
      const scoreMax = {message_density: 20, source_quality: 25, price_validation: 25, supply_constraint: 20, a_share_movement: 10};
      const details = document.getElementById('detail-list');

      data.candidates.forEach((item, index) => {
        const panel = document.createElement('details');
        panel.className = 'detail-card';
        const summary = document.createElement('summary');
        const left = document.createElement('span');
        left.textContent = `${index + 1}. ${valueOrDash(item.material_chain)}`;
        const right = document.createElement('span');
        right.className = `status-badge ${statusClass(item.status)}`;
        right.textContent = `${item.total_score} · ${item.status}`;
        summary.append(left, right);
        panel.appendChild(summary);

        const body = document.createElement('div');
        body.className = 'detail-body';
        const scoreGrid = document.createElement('div');
        scoreGrid.className = 'score-grid';
        Object.entries(scoreNames).forEach(([key, label]) => {
          const box = document.createElement('div');
          box.className = 'mini-score';
          const name = document.createElement('span');
          name.textContent = label;
          const amount = document.createElement('strong');
          amount.textContent = `${item.scores[key]}/${scoreMax[key]}`;
          box.append(name, amount);
          scoreGrid.appendChild(box);
        });
        body.appendChild(scoreGrid);

        const priceAudit = item.score_details && item.score_details.price_validation || {};
        const supplyAudit = item.score_details && item.score_details.supply_constraint || {};
        const marketAudit = item.score_details && item.score_details.a_share_movement || {};
        const catalystAudit = item.score_details && item.score_details.forward_catalyst || {};
        const catalyst = item.forward_catalyst && typeof item.forward_catalyst === 'object' ? item.forward_catalyst : {};
        const gate = item.status_gate || {};
        const gateReason = Array.isArray(gate.reasons) && gate.reasons.length
          ? gate.reasons.join('；')
          : (gate.passed ? '已通过' : '总分未触发高确定性 Gate');
        const facts = document.createElement('div');
        facts.className = 'fact-grid';
        [
          ['确认路径', item.gate_path],
          ['Gate 审计', `${gate.applied ? '已应用' : '未应用'} / ${gate.passed ? '通过' : '未通过'} — ${gateReason}`],
          ['价格阶段', `${valueOrDash(priceAudit.evidence_type)} / ${valueOrDash(priceAudit.change_basis)}`],
          ['核心催化', item.core_catalyst],
          ['价格子项', `阶段 ${valueOrDash(priceAudit.evidence_points)}；涨幅 ${valueOrDash(priceAudit.change_pct)}%/${valueOrDash(priceAudit.change_points)}分；覆盖 ${valueOrDash(priceAudit.breadth_count)}/${valueOrDash(priceAudit.breadth_points)}分；持续 ${valueOrDash(priceAudit.persistence_days)}天/${valueOrDash(priceAudit.persistence_points)}分 — ${valueOrDash(item.price && item.price.description)}`],
          ['供给子项', `库存 ${valueOrDash(supplyAudit.inventory)}/${valueOrDash(supplyAudit.inventory_points)}分；开工/交期 ${valueOrDash(supplyAudit.utilization_leadtime)}/${valueOrDash(supplyAudit.utilization_leadtime_points)}分；扰动 ${valueOrDash(supplyAudit.disruption)}/${valueOrDash(supplyAudit.disruption_points)}分；需求/缺口 ${valueOrDash(supplyAudit.demand_gap)}/${valueOrDash(supplyAudit.demand_gap_points)}分 — ${valueOrDash(item.supply && item.supply.description)}`],
          ['A股验证', `超额 ${valueOrDash(marketAudit.excess_return_pct)}%；广度 ${valueOrDash(marketAudit.positive_breadth_pct)}%；成交 ${valueOrDash(marketAudit.turnover_ratio)}倍；正超额 ${valueOrDash(marketAudit.positive_excess_days)}天；直接受益股 ${valueOrDash(marketAudit.direct_beneficiary_count)}只 — ${valueOrDash(item.a_share && item.a_share.description)}`],
          ['Forward Catalyst', `${catalystAudit.valid ? '有效' : '无效/缺失'}；status=${valueOrDash(catalyst.status)}；type=${valueOrDash(catalyst.type)}；timing_basis=${valueOrDash(catalyst.timing_basis)}；start=${valueOrDash(catalyst.start_date)}；end=${valueOrDash(catalyst.end_date)}；observed_start=${valueOrDash(catalyst.observed_start)}；证据=${Array.isArray(catalyst.evidence_refs) && catalyst.evidence_refs.length ? catalyst.evidence_refs.join(', ') : '—'}；原因=${Array.isArray(catalystAudit.reasons) && catalystAudit.reasons.length ? catalystAudit.reasons.join('；') : '无'} — ${valueOrDash(catalyst.description)}`]
        ].forEach(([label, value]) => {
          const block = document.createElement('div');
          const heading = document.createElement('h3');
          heading.textContent = label;
          const paragraph = document.createElement('p');
          paragraph.textContent = valueOrDash(value);
          block.append(heading, paragraph);
          facts.appendChild(block);
        });
        body.appendChild(facts);

        const evidenceTitle = document.createElement('h3');
        evidenceTitle.textContent = '关键证据';
        body.appendChild(evidenceTitle);
        const evidenceList = document.createElement('ul');
        evidenceList.className = 'evidence-list';
        (item.evidence || []).forEach(row => {
          const li = document.createElement('li');
          const tier = document.createElement('span');
          tier.className = 'tier-badge';
          tier.textContent = valueOrDash(row.tier);
          const text = document.createElement('span');
          const supports = Array.isArray(row.supports) && row.supports.length ? ` [${row.supports.join(', ')}]` : '';
          text.textContent = `${valueOrDash(row.date)} · ${valueOrDash(row.publisher)} — ${valueOrDash(row.claim)}${supports}`;
          li.append(tier, text);
          const href = safeUrl(row.url);
          if (href) {
            const link = document.createElement('a');
            link.href = href;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';
            link.textContent = '来源';
            li.appendChild(link);
          }
          evidenceList.appendChild(li);
        });
        if (!evidenceList.children.length) {
          const li = document.createElement('li');
          li.textContent = '没有可展示证据';
          evidenceList.appendChild(li);
        }
        body.appendChild(evidenceList);

        const beneficiaryTitle = document.createElement('h3');
        beneficiaryTitle.textContent = 'A股受益公司';
        body.appendChild(beneficiaryTitle);
        const beneficiaryList = document.createElement('ul');
        beneficiaryList.className = 'evidence-list';
        const beneficiaries = item.a_share && Array.isArray(item.a_share.beneficiaries) ? item.a_share.beneficiaries : [];
        beneficiaries.forEach(stock => {
          const li = document.createElement('li');
          const tag = document.createElement('span');
          tag.className = 'tier-badge';
          tag.textContent = stock.directness === 'direct' ? '直接' : '间接';
          const text = document.createElement('span');
          text.textContent = `${valueOrDash(stock.code)} · ${valueOrDash(stock.name)} — ${valueOrDash(stock.basis)}`;
          li.append(tag, text);
          beneficiaryList.appendChild(li);
        });
        if (!beneficiaryList.children.length) {
          const li = document.createElement('li');
          li.textContent = '未完成映射';
          beneficiaryList.appendChild(li);
        }
        body.appendChild(beneficiaryList);

        const notes = document.createElement('div');
        notes.className = 'note-grid';
        [
          ['反证', item.counterevidence],
          ['失效条件', item.invalidation_conditions],
          ['数据缺口', item.data_gaps]
        ].forEach(([label, values]) => {
          const block = document.createElement('div');
          const heading = document.createElement('h3');
          heading.textContent = label;
          const list = document.createElement('ul');
          (Array.isArray(values) && values.length ? values : ['无']).forEach(value => {
            const li = document.createElement('li');
            li.textContent = value && typeof value === 'object'
              ? `[${valueOrDash(value.effect)}] ${valueOrDash(value.description)}（维度：${valueOrDash(value.dimension)}；证据：${Array.isArray(value.evidence_refs) && value.evidence_refs.length ? value.evidence_refs.join(', ') : '—'}${Array.isArray(value.downgrade_reasons) && value.downgrade_reasons.length ? `；降级原因：${value.downgrade_reasons.join('；')}` : ''}）`
              : valueOrDash(value);
            list.appendChild(li);
          });
          block.append(heading, list);
          notes.appendChild(block);
        });
        body.appendChild(notes);

        if (item.status_gate && item.status_gate.applied && !item.status_gate.passed) {
          const gateBox = document.createElement('div');
          gateBox.className = 'gate-warning';
          const heading = document.createElement('h3');
          heading.textContent = '门槛降级';
          const paragraph = document.createElement('p');
          paragraph.textContent = (item.status_gate.reasons || []).join('；') || '未通过高确定性门槛';
          gateBox.append(heading, paragraph);
          body.appendChild(gateBox);
        }
        panel.appendChild(body);
        details.appendChild(panel);
      });

      const excluded = Array.isArray(data.excluded_candidates) ? data.excluded_candidates : [];
      if (excluded.length) {
        document.getElementById('excluded-section').hidden = false;
        const list = document.getElementById('excluded-list');
        excluded.forEach(item => {
          const li = document.createElement('li');
          li.textContent = `${valueOrDash(item.material_chain)}：${valueOrDash(item.reason)}`;
          list.appendChild(li);
        });
      }
    })();
  </script>
</body>
</html>
