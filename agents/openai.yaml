interface:
  display_name: "材料涨价雷达"
  short_description: "发现材料涨价与供需拐点，核验证据并生成100分雷达榜"
  default_prompt: "使用 $a-stock-material-price-radar 扫描近10天材料涨价、价格前动作和供需拐点，核验证据、反证与确认路径，并输出排序总览和证据附录。"

# 如果 Skill 只希望在点名时调用
policy:
  allow_implicit_invocation: false

